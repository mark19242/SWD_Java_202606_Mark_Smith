<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroVault | Unlock the Sky</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="logo">AEROVAULT</div>

      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#models">Models</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="home">
        <div class="hero-content">
          <p class="hero-label">PERSONAL FLIGHT SYSTEMS</p>

          <h1>Unlock the Sky.</h1>

          <p class="hero-description">
            Personal flight is no longer science fiction. AeroVault jetpacks
            combine advanced engineering, precision control, and uncompromising
            performance.
          </p>

          <a class="cta-button" href="#models">Explore Models</a>
        </div>

        <div class="hero-image">
          <img
            src="images/aerovault-hero.png"
            alt="AeroVault pilot flying with a futuristic jetpack"
          />
        </div>
      </section>
    </main>
  </body>
</html>
