<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Contact Form</title>
  </head>

  <body>
    <header>
      <h1>Contact Us</h1>
    </header>

    <main>
      <form action="/submit-contact" method="post">
        <fieldset>
          <legend>Your Details</legend>

          <label for="user-name">Name:</label>
          <input
            type="text"
            id="user-name"
            name="full_name"
            autocomplete="name"
            required
          />

          <label for="user-email">Email:</label>
          <input
            type="email"
            id="user-email"
            name="email"
            autocomplete="email"
            required
          />
        </fieldset>
      </form>
    </main>
  </body>
</html>
