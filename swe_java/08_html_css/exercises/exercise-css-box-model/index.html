<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <header>
      <h1>CSS Box Model</h1>
      <p>Exploring how CSS display properties affect page layout.</p>
    </header>

    <main>
      <section>
        <h2>Display Types</h2>

        <div class="block-example">This is a block-level element.</div>

        <p>
          This paragraph contains an
          <span class="inline-example">inline element</span>
          inside of it.
        </p>

        <span class="block-conversion">
          This span has been converted from inline to block.
        </span>

        <span class="inline-block-example">
          This is an inline-block element.
        </span>
      </section>
    </main>
  </body>
</html>
