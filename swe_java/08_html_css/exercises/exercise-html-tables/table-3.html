<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Column Grouping & Multi-Metric Matrix</title>
  </head>

  <body>
    <header>
      <h1>Column Grouping & Multi-Metric Matrix</h1>
    </header>

    <main>
      <table>
        <caption>
          Comprehensive Curriculum &amp; Assessment Matrix
        </caption>

        <colgroup>
          <col class="col-lead" />
          <col class="col-metrics" span="3" />
        </colgroup>

        <thead>
          <tr>
            <th scope="col">Module</th>
            <th scope="col">Duration (Wks)</th>
            <th scope="col">Lecture (Hrs)</th>
            <th scope="col">Lab (Hrs)</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Backend Systems &amp; APIs</th>
            <td>6</td>
            <td>60</td>
            <td>120</td>
          </tr>

          <tr>
            <th scope="row">Database Architecture</th>
            <td>4</td>
            <td>40</td>
            <td>80</td>
          </tr>
        </tbody>

        <tfoot>
          <tr>
            <th scope="row">Total Instructional Load</th>
            <td>10</td>
            <td>100</td>
            <td>200</td>
          </tr>
        </tfoot>
      </table>

      <p>
        <a href="index.html">Back to Home</a>
      </p>
    </main>
  </body>
</html>
